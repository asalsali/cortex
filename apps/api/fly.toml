app = "cortex-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  API_PORT = "4000"
  MCP_PORT = "4001"
  NODE_ENV = "production"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/health"
  timeout = "5s"

[[services]]
  internal_port = 4001
  protocol = "tcp"

  [[services.ports]]
    port = 4001

  [[services.tcp_checks]]
    grace_period = "10s"
    interval = "30s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
